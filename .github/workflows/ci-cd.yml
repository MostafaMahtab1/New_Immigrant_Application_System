name: Immigrant App CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      # Upgraded to v5 to fix the deprecation warning
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        # Crucial Fix: Tells GitHub Actions exactly where pom.xml sits
        cache-dependency-path: newimm-domain/pom.xml

    - name: Run Checkstyle Quality Gate
      # Changes directory into code subfolder before running style validations
      run: |
        cd newimm-domain
        mvn checkstyle:check

    - name: Build with Maven & Run 11 Unit Tests
      # Changes directory into your code subfolder before executing unit tests
      run: |
        cd newimm-domain
        mvn clean test
