name: Immigrant App CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        # Targets the subfolder path cleanly
        cache-dependency-path: newimm-domain/pom.xml

    - name: Run Checkstyle Quality Gate
      # Steps into the subfolder track before checking coding styles
      run: |
        cd newimm-domain
        mvn checkstyle:check

    - name: Build with Maven & Run 11 Unit Tests
      # Steps into the subfolder track before compiling code and running tests
      run: |
        cd newimm-domain
        mvn clean test
