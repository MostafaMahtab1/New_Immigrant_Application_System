name: Immigrant App CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        # FIXED: Targets the pom.xml right inside the default checked-out directory tree
        cache-dependency-path: "**/pom.xml"

    - name: Run Checkstyle Quality Gate
      # FIXED: Uses find-execution parameters to automatically find and check style rules anywhere in the repo
      run: |
        mvn checkstyle:check -f $(find . -name pom.xml)

    - name: Build with Maven & Run 11 Unit Tests
      # FIXED: Uses explicit configuration targeting to compile code regardless of local path variations
      run: |
        mvn clean test -f $(find . -name pom.xml)
