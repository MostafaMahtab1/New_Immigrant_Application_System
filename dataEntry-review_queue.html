 <!-- Reviewer Queue - Applications from Data Entry or Approver -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reviewer Queue</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 20px;
}
h2 { text-align: center; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px; border: 1px solid #ccc; }
tr:hover { background: #eef; cursor: pointer; }
</style>
</head>
<body>
<h2>Reviewer Queue –  Applications from Data Entry or Approver</h2>
<table>
<thead>
<tr><th>ID</th><th>Full Name</th><th>Status</th></tr>
</thead>
<tbody id="apps"></tbody>
</table>

<script>
async function load() {
    const res = await fetch("/api/queue/reviewer");
    const apps = await res.json();
    const tbody = document.getElementById("apps");
    tbody.innerHTML = apps.map(a => `<tr onclick="openForm('${a.applicantId}')">
        <td>${a.applicantId}</td>
        <td>${a.fullName}</td>
        <td>${a.status}</td>
    </tr>`).join("");
}
function openForm(id){
    localStorage.setItem("selectedApplicantId", id);
    window.location.href="reviewer.html";
}
load();
</script>
</body>
</html>
