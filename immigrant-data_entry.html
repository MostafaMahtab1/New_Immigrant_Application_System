<!-- Data Entry main UI -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Entry – New Immigrant Application</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
h2 { text-align: center; }
label { display: block; margin-top: 10px; font-weight: bold; }
input, textarea { width: 400px; padding: 5px; margin-top: 3px; }
.actions { margin-top: 20px; }
button { padding: 6px 12px; margin-right: 10px; cursor: pointer; }
.save-notice { color: #007bff; display: none; margin-top: 10px; }
.alien-relative { margin-top: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
</style>
</head>
<body>

<h2>Data Entry – New Immigrant Application</h2>

<label for="applicantId">Applicant ID</label>
<input type="text" id="applicantId" readonly>

<label for="fullName">Full Name</label>
<input type="text" id="fullName">

<label for="dob">Date of Birth</label>
<input type="date" id="dob">

<label for="address">Address</label>
<textarea id="address"></textarea>

<label for="email">Email</label>
<input type="email" id="email">

<label for="phone">Phone</label>
<input type="tel" id="phone">

<h3>Alien Relatives</h3>
<div id="alienRelativeList"></div>
<button type="button" id="addRelativeBtn">+ Add Relative</button>

<div class="actions">
<button id="saveBtn">💾 Save</button>
<button id="submitBtn">📤 Submit to Reviewer</button>
</div>
<p class="save-notice" id="saveNotice">💾 Saved!</p>

<script>
function generateApplicantId() {
    document.getElementById("applicantId").value = "A" + Math.floor(100000000 + Math.random() * 900000000);
}
window.onload = generateApplicantId;

const alienList = document.getElementById("alienRelativeList");
document.getElementById("addRelativeBtn").onclick = () => {
    const div = document.createElement("div");
    div.classList.add("alien-relative");
    div.innerHTML = `
        <label>Full Name</label><input type="text">
        <label>DOB</label><input type="date">
        <label>Address</label><input type="text">
        <label>Email</label><input type="email">
        <label>Phone</label><input type="tel">
        <button type="button" class="removeBtn">Remove</button>
    `;
    div.querySelector(".removeBtn").onclick = () => div.remove();
    alienList.appendChild(div);
};

function collectAlienRelatives() {
    const list = [];
    alienList.querySelectorAll(".alien-relative").forEach(div => {
        const inputs = div.querySelectorAll("input");
        list.push({
            fullName: inputs[0].value,
            dob: inputs[1].value,
            address: inputs[2].value,
            email: inputs[3].value,
            phone: inputs[4].value
        });
    });
    return list;
}

async function save(status="DATA_ENTRY_SAVED") {
    const data = {
        applicantId: document.getElementById("applicantId").value,
        fullName: document.getElementById("fullName").value,
        dob: document.getElementById("dob").value,
        address: document.getElementById("address").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        alienRelatives: collectAlienRelatives(),
        status
    };
    await fetch("/api/immigrant", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });
}

document.getElementById("saveBtn").onclick = async () => {
    await save();
    document.getElementById("saveNotice").style.display = "block";
    setTimeout(()=>document.getElementById("saveNotice").style.display="none", 1500);
};

document.getElementById("submitBtn").onclick = async () => {
    await save("DATA_ENTRY_SUBMITTED");
    alert("✅ Submitted to Reviewer Queue!");
    window.location.reload();
};
</script>
</body>
</html>
