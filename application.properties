// Contributor - Mostafa Mahtab
// Configuration file for database connection and JPA settings
// Credentials are now loaded from environment variables for security

spring.datasource.url=jdbc:mysql://localhost:3306/cs321g15?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Enable Hibernate to create/update tables
spring.jpa.hibernate.ddl-auto=update

# Make sure Spring ALWAYS runs schema.sql and data.sql on startup
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# (Optional) show SQL in console
spring.jpa.show-sql=true
